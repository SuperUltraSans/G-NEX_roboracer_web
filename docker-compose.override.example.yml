# 리버스 프록시 뒤 서브패스(예: https://<도메인>/roboracer/)에 둘 때의 예시.
# 이 파일을 docker-compose.override.yml 로 복사해 고친다. override 파일은 git 에 올리지 않고(.gitignore),
# docker compose 가 docker-compose.yml 과 함께 자동으로 읽는다.
#
#   cp docker-compose.override.example.yml docker-compose.override.yml
#   docker compose up -d --build
#
# - 프록시가 /roboracer 프리픽스를 떼고 컨테이너의 8000 번으로 넘긴다고 가정한다.
#   /roboracer/ws/ 에는 WebSocket Upgrade 헤더를 넘겨야 한다 (README "리버스 프록시 뒤에서 운영할 때").
# - 프론트를 그 경로로 빌드하고, 세션 쿠키 범위도 그 경로로 좁힌다.

services:
  app:
    build:
      args:
        VITE_BASE_PATH: /roboracer/
        # 관리자 기능을 프록시에서 잠갔을 때 운영진 로그인 링크를 숨긴다
        # VITE_HIDE_ADMIN_LINK: "true"
    environment:
      APP_ENV: production
      COOKIE_SECURE: "true"          # HTTPS 프록시 뒤라면 true
      COOKIE_PATH: /roboracer
      # 프록시(엣지 nginx)의 주소나 그 도커 네트워크 대역만 적는다. "*" 로 두면 방문자가
      # X-Forwarded-For 를 꾸며 시도 제한을 피하거나 남의 IP 를 막을 수 있다
      FORWARDED_ALLOW_IPS: "172.18.0.0/16"
      # 검색엔진용 공개 주소(대표 주소·사이트맵·대표 그림). 끝에 / 를 붙인다
      PUBLIC_URL: https://example.com/roboracer/
      # 구글 서치 콘솔·네이버 서치어드바이저 소유 확인 meta 태그의 content 값 (받으면 넣는다)
      # GOOGLE_SITE_VERIFICATION: ...
      # NAVER_SITE_VERIFICATION: ...
    # 프록시와 같은 도커 네트워크에 붙인다면 포트를 공개하지 않는다
    ports: !reset []
    networks: [proxy-net]

networks:
  proxy-net:
    external: true
