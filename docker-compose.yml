# 단일 컨테이너 실행 (학교 서버 기본 구성)
#
#   docker compose up -d --build
#   docker compose exec app python -m app.cli create-user --username admin --role admin
#
# - FastAPI 가 API, WebSocket, 빌드된 프론트엔드를 모두 서빙한다 (http://<서버>:8000).
# - DB 는 ./backend/data 에 남는다. 컨테이너는 uid 1000 으로 돈다.
# - 설정은 backend/.env 에서 읽는다 (없어도 된다). 리버스 프록시 뒤 HTTPS 라면 COOKIE_SECURE=true.

services:
  app:
    build:
      context: .
      args:
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/}
    image: roboracer:latest
    env_file:
      - path: backend/.env
        required: false
    environment:
      FRONTEND_DIST: /app/frontend/dist
      DATABASE_URL: sqlite:///./data/roboracer.db
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ./backend/data:/app/backend/data
    restart: unless-stopped
